<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>EV MONITOR 741 RA</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #005eb8; --bg: #f4f6f8; --accent: #e65100; --expense: #c62828; --check: #6a1b9a; --consumption: #00838f; --excel: #1d6f42; --edit: #fbc02d; --save: #2e7d32; --time: #5e35b1; --setting: #455a64; --maint: #795548; --bill: #f9a825; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 15px; color: #333; margin: 0; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); max-width: 550px; width: 100%; margin-bottom: 20px; border-top: 5px solid var(--primary); box-sizing: border-box; }
        h2 { color: var(--primary); text-align: center; margin: 0; font-size: 1.4rem; }
        .model-badge { text-align: center; font-size: 0.75em; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #eee; padding: 5px; border-radius: 12px; flex-wrap: wrap; justify-content: center; }
        .tab { flex: 1; padding: 8px 4px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; background: none; color: #666; font-size: 0.75em; min-width: 60px; white-space: nowrap; }
        .tab.active { background: white; color: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .form-section { display: none; animation: fadeIn 0.3s; }
        .form-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.75em; color: #666; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; -webkit-appearance: none; background: white; }
        textarea { resize: vertical; height: 70px; font-family: inherit; }

        .radio-group { display: flex; gap: 10px; background: #f9f9f9; padding: 5px; border-radius: 10px; border: 1px solid #ddd; }
        .radio-label { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 0.9em; font-weight: bold; color: #555; transition: 0.2s; }
        .radio-label:has(input:checked) { background: var(--primary); color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .radio-label input { display: none; }

        .power-ctrl { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .btn-step { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        
        .res-box { background: #e3f2fd; color: #1565c0; padding: 12px; border-radius: 12px; margin-top: 10px; border: 1px solid #bbdefb; }
        .res-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9em; }
        .res-highlight { border-top: 1px solid #bbdefb; padding-top: 5px; margin-top: 5px; font-weight: bold; color: var(--accent); }
        
        .power-box { background: #fffde7; padding: 12px; border-radius: 12px; border: 1px solid #fbc02d; margin-bottom: 10px; }
        
        button.main-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 10px; background: var(--primary); color: white; font-size: 1rem; transition: background 0.3s; }
        button.main-btn.editing { background: var(--edit); color: #333; }
        .btn-cancel { display:none; width:100%; margin-top:5px; padding:10px; border:none; background:#ccc; border-radius:10px; font-weight:bold; cursor: pointer; }
        
        .history-card { background: white; width: 100%; max-width: 1000px; padding: 15px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); box-sizing: border-box; }
        
        .stats-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .stat-small { background: #fff; padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #eee; }
        .stat-detail { font-size: 0.7em; color: #666; margin-top: 3px; display: block; line-height: 1.2; font-weight: bold; }
        
        .chart-container { width: 100%; height: 300px; margin-bottom: 20px; }
        .table-wrapper { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8em; min-width: 950px; }
        th { text-align: left; padding: 10px; background: #f8f9fa; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; vertical-align: middle; }
        
        .show-more-btn { width: 100%; padding: 10px; background: #f0f4f8; border: none; color: var(--primary); font-weight: bold; border-radius: 0 0 10px 10px; cursor: pointer; margin-top: 5px; }
        
        .actions-footer { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn-action { padding: 10px 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.75em; color: white; display: flex; align-items: center; gap: 5px; text-decoration: none; }
        
        .setup-box { background: #eceff1; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #cfd8dc; }
        
        .bill-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; min-width: auto; }
        .bill-table th { background: #fff3e0; color: #ef6c00; padding: 8px; }
        .bill-table td { padding: 8px; text-align: center; border-bottom: 1px solid #eee; }
        .dispersion-box { background: #fff8e1; border: 1px solid #ffecb3; padding: 10px; border-radius: 10px; margin-bottom: 10px; text-align: center; }

        .btn-caffe-large { background-color: #29abe0; color: white !important; font-size: 1rem; padding: 12px 25px; border-radius: 50px; box-shadow: 0 4px 10px rgba(41, 171, 224, 0.3); display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: bold; }
        .info-btn { display: inline-block; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white; text-decoration: none; font-weight: bold; font-size: 0.75em; padding: 6px 12px; border-radius: 15px; margin-bottom: 10px; }

        @media print {
            .card, .tabs, .form-section, .actions-footer, .show-more-btn { display: none !important; }
            .history-card { box-shadow: none; border: none; width: 100%; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>EV MONITOR 741 RA</h2>
    <div class="model-badge" id="lblModelBadge">Ready</div>

    <div style="text-align: center; margin-bottom: 10px;">
        <a href="https://ig.me/m/brigantelucano" target="_blank" class="info-btn">ℹ️ Info / Contattami</a>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="openTab('stima')">⏱️ Stima</button>
        <button class="tab" onclick="openTab('carica')">🔌 Ricarica</button>
        <button class="tab" onclick="openTab('check')">📝 Check</button>
        <button class="tab" onclick="openTab('manutenzione')" style="color:var(--maint)">🛠️ Manut.</button>
        <button class="tab" onclick="openTab('bolletta')" style="color:var(--bill)">📄 Bolletta</button>
        <button class="tab" style="color:var(--setting)" onclick="openTab('settings')">⚙️ Setup</button>
    </div>

    <div id="stima" class="form-section active">
        <div class="power-box">
            <label>⚡ Potenza di Ricarica (kW)</label>
            <div class="power-ctrl">
                <button class="btn-step" onclick="stepPower(-0.1)">-</button>
                <input type="text" inputmode="decimal" id="pKw_stima" oninput="syncPower(this.value)" placeholder="Es: 2.3">
                <button class="btn-step" onclick="stepPower(0.1)">+</button>
            </div>
        </div>
        <div class="grid">
            <div><label>% Attuale</label><input type="number" id="s_att" oninput="calcolaStima()"></div>
            <div><label>% Target</label><input type="number" id="s_tar" oninput="calcolaStima()"></div>
        </div>
        <div class="grid">
             <div style="grid-column: span 2;">
                <label>⏰ Orario Prelievo Auto</label>
                <input type="time" id="s_orario_fine" oninput="calcolaStima()">
            </div>
        </div>
        <div class="res-box">
            <div class="res-item"><span>Energia:</span> <b id="resKwhStima">0 kWh</b></div>
            <div class="res-item"><span>Tempo:</span> <b id="resTempo">-</b></div>
            <div class="res-item res-highlight"><span>COLLEGA ALLE:</span> <b id="resOrarioAvvio" style="font-size:1.3em;">--:--</b></div>
        </div>
    </div>

    <div id="carica" class="form-section">
        <input type="hidden" id="editIndex" value="-1">
        <div class="grid">
            <div style="grid-column: span 2;"><label>Data Ricarica</label><input type="date" id="data_inserimento"></div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr;">
            <label>📍 Luogo</label>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="luogoRicarica" value="DOMESTICA" checked> 🏠 Domestica</label>
                <label class="radio-label"><input type="radio" name="luogoRicarica" value="COLONNINA"> ⛽ Colonnina</label>
            </div>
        </div>
        <div class="grid"><div style="grid-column: span 2;"><label>Km Totali</label><input type="number" id="kmOdo"></div></div>
        <div class="grid"><div><label>% Inizio</label><input type="number" id="c_att"></div><div><label>% Fine</label><input type="number" id="c_tar"></div></div>
        
        <div class="grid">
            <div><label>🟢 Ora Inizio (Opz.)</label><input type="time" id="t_start"></div>
            <div><label>🔴 Ora Fine (Opz.)</label><input type="time" id="t_end"></div>
        </div>

        <div class="power-box">
            <label>⚡ Potenza (kW)</label>
            <div class="power-ctrl">
                <button class="btn-step" onclick="stepPower(-0.1)">-</button>
                <input type="text" inputmode="decimal" id="pKw_carica" oninput="syncPower(this.value)">
                <button class="btn-step" onclick="stepPower(0.1)">+</button>
            </div>
        </div>
        <div class="grid"><div><label>Luce €/kWh</label><input type="number" id="pLuce" step="0.001"></div><div><label>Diesel €/L</label><input type="number" id="pDiesel" step="0.001"></div></div>
        <button id="btnSalva" class="main-btn" onclick="salvaRicarica()">💾 Salva Ricarica</button>
        <button id="btnAnnulla" class="btn-cancel" onclick="annullaModifica()">❌ Annulla</button>
    </div>

    <div id="check" class="form-section">
        <input type="hidden" id="editCheckIndex" value="-1">
        <div class="grid"><div style="grid-column: span 2;"><label>Data Controllo</label><input type="date" id="chk_data"></div></div>
        <div class="grid"><div><label>Km Totali</label><input type="number" id="chk_km"></div><div><label>% Batteria</label><input type="number" id="chk_perc"></div></div>
        <button id="btnSalvaCheck" class="main-btn" style="background:var(--check)" onclick="salvaCheck()">📝 Registra Stato</button>
        <button id="btnAnnullaCheck" class="btn-cancel" onclick="annullaModificaCheck()">❌ Annulla</button>
    </div>

    <div id="manutenzione" class="form-section">
        <input type="hidden" id="editMaintIndex" value="-1">
        <div class="grid"><div style="grid-column: span 2;"><label>Data</label><input type="date" id="man_data"></div></div>
        <div class="grid"><div><label>Costo (€)</label><input type="number" id="man_costo" step="0.01"></div><div><label>Km</label><input type="number" id="man_km"></div></div>
        <div class="grid"><div style="grid-column: span 2;"><label>Note</label><textarea id="man_note"></textarea></div></div>
        <button id="btnSalvaMaint" class="main-btn" style="background:var(--maint)" onclick="salvaManutenzione()">🛠️ Registra</button>
        <button id="btnAnnullaMaint" class="btn-cancel" onclick="annullaModificaMaint()">❌ Annulla</button>
    </div>

    <div id="bolletta" class="form-section">
        <div class="setup-box" style="background:#fff3e0; border-color:#ffe0b2;">
            <h3 style="margin-top:0; color:#ef6c00;">⚡ Stima Bolletta</h3>
            <div class="dispersion-box">
                <label>Perdita Domestica (%)</label>
                <input type="number" id="dispersionVal" value="15" step="0.1" style="width:70px;text-align:center;" onchange="updateDispersion()">
            </div>
            <table class="bill-table"><thead><tr><th>Mese</th><th>kWh Auto</th><th>kWh Rete</th><th>Costo</th></tr></thead><tbody id="billBody"></tbody></table>
        </div>
    </div>

    <div id="settings" class="form-section">
        <div class="setup-box">
            <label>🔋 Capacità Batteria (kWh)</label><input type="number" id="conf_cap" step="0.1">
            <label>⛽ Diesel (L/100km)</label><input type="number" id="conf_diesel_l100" step="0.1">
            <label>🚙 Consumo EV (kWh/100km)</label><input type="number" id="conf_cons_ev" step="0.1">
        </div>
        <button class="main-btn" style="background:var(--setting)" onclick="salvaConfig()">💾 Salva Config</button>
        <button class="main-btn" onclick="esportaExcel()" style="background: var(--excel);">📊 Esporta Backup</button>
    </div>
</div>

<div class="history-card">
    <div class="stats-summary">
        <div class="stat-small"><small>KM AUTO</small><br><b id="totKmReali" style="color:var(--accent)">0</b></div>
        <div class="stat-small"><small>kWh/100km</small><br><b id="avgConsumo" style="color:var(--consumption)">---</b></div>
        <div class="stat-small"><small>RISPARMIO</small><br><b id="totRisp" style="color:var(--save)">€ 0.00</b></div>
        <div class="stat-small"><small>SPESA TOT.</small><br><b id="totSpesa" style="color:var(--expense)">€ 0.00</b></div>
    </div>
    <div class="chart-container"><canvas id="savingsChart"></canvas></div>
    <div class="table-wrapper">
        <table id="tabella"><thead><tr><th>Data</th><th>Tipo</th><th>Km</th><th>Diff</th><th>Info</th><th>Orari</th><th>Spesa</th><th>Risp</th><th>Azioni</th></tr></thead><tbody></tbody></table>
        <button id="btnShowMore" class="show-more-btn" onclick="toggleShowAll()">⬇️ Mostra tutto</button>
    </div>
    <div class="actions-footer">
        <a href="https://ko-fi.com/briglucano" target="_blank" class="btn-caffe-large">☕ Offri un Caffè</a>
        <div class="btn-group">
            <button class="btn-action" style="background:var(--excel)" onclick="esportaExcel()">📊 Export</button>
            <button class="btn-action" style="background:var(--primary)" onclick="document.getElementById('fileInput').click()">📥 Import CSV</button>
            <input type="file" id="fileInput" style="display:none" accept=".csv" onchange="importaCSV(event)">
            <button style="background:none; border:none; color:red; font-size:0.7em;" onclick="pulisci()">Reset DB</button>
        </div>
    </div>
</div>

<script>
const DEFAULT_CONFIG = { cap: 43.2, consTermico: 5.5, consEv: 15.5, efficienza: 0.86 };
const DB_NAME = 'ev_monitor_v5_5';
const CONF_NAME = 'ev_config_v5_5';
let appConfig = {};
let myChart = null;
let showAllHistory = false;

window.onload = function() {
    loadConfig();
    const savedDisp = localStorage.getItem('ev_dispersion_v2');
    if(savedDisp !== null) document.getElementById('dispersionVal').value = savedDisp;
    const today = new Date().toISOString().split('T')[0];
    ['data_inserimento', 'chk_data', 'man_data'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = today; });
    const pref = JSON.parse(localStorage.getItem('ev_pref_v5_5'));
    if(pref) {
        document.getElementById('pLuce').value = pref.pL || '';
        document.getElementById('pDiesel').value = pref.pD || '';
        document.getElementById('pKw_stima').value = pref.pKw || 2.3;
        document.getElementById('pKw_carica').value = pref.pKw || 2.3;
    }
    render();
};

function loadConfig() {
    appConfig = JSON.parse(localStorage.getItem(CONF_NAME)) || {...DEFAULT_CONFIG};
    document.getElementById('conf_cap').value = appConfig.cap;
    document.getElementById('conf_diesel_l100').value = appConfig.consTermico;
    document.getElementById('conf_cons_ev').value = appConfig.consEv;
    document.getElementById('lblModelBadge').innerText = `Batt: ${appConfig.cap} kWh`;
}

function salvaConfig() {
    appConfig.cap = parseFloat(document.getElementById('conf_cap').value) || 43.2;
    appConfig.consTermico = parseFloat(document.getElementById('conf_diesel_l100').value) || 5.5;
    appConfig.consEv = parseFloat(document.getElementById('conf_cons_ev').value) || 15.5;
    localStorage.setItem(CONF_NAME, JSON.stringify(appConfig));
    alert("Salvato!");
}

function parseLocalNum(str) {
    if(!str) return 0;
    let s = String(str).replace(/[€"'\s]/g, '').replace(',', '.');
    return parseFloat(s) || 0;
}

function openTab(name) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
    const b = Array.from(document.querySelectorAll('.tab')).find(x => x.innerText.toLowerCase().includes(name.toLowerCase()));
    if(b) b.classList.add('active');
    document.getElementById(name).classList.add('active');
    if(name === 'bolletta') calcolaBolletta();
}

function syncPower(val) {
    document.getElementById('pKw_stima').value = val;
    document.getElementById('pKw_carica').value = val;
    calcolaStima();
}

function stepPower(delta) {
    let v = parseFloat(document.getElementById('pKw_stima').value) || 2.3;
    syncPower((v + delta).toFixed(1));
}

function calcolaStima() {
    const att = parseFloat(document.getElementById('s_att').value) || 0;
    const tar = parseFloat(document.getElementById('s_tar').value) || 0;
    const kw = parseFloat(document.getElementById('pKw_stima').value) || 2.3;
    if (tar > att) {
        const kwh = appConfig.cap * (tar - att) / 100;
        const oreDec = kwh / kw;
        document.getElementById('resKwhStima').innerText = kwh.toFixed(1) + " kWh";
        document.getElementById('resTempo').innerText = Math.floor(oreDec) + "h " + Math.round((oreDec % 1)*60) + "m";
        const orarioFine = document.getElementById('s_orario_fine').value;
        if (orarioFine) {
            const [h, m] = orarioFine.split(':').map(Number);
            const d = new Date();
            let target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
            if(target < d) target.setDate(target.getDate()+1);
            const start = new Date(target.getTime() - (oreDec * 3600000));
            document.getElementById('resOrarioAvvio').innerText = String(start.getHours()).padStart(2,'0') + ":" + String(start.getMinutes()).padStart(2,'0');
        }
    }
}

function calcDiffMin(start, end) {
    if(!start || !end) return 0;
    const [h1, m1] = start.split(':').map(Number);
    const [h2, m2] = end.split(':').map(Number);
    let diff = (h2*60+m2) - (h1*60+m1);
    return diff < 0 ? diff + 1440 : diff;
}

function updateDispersion() {
    localStorage.setItem('ev_dispersion_v2', document.getElementById('dispersionVal').value);
    render();
    calcolaBolletta();
}

function salvaRicarica() {
    const dataIn = document.getElementById('data_inserimento').valueAsDate || new Date();
    const att = parseFloat(document.getElementById('c_att').value);
    const tar = parseFloat(document.getElementById('c_tar').value);
    const km = parseFloat(document.getElementById('kmOdo').value);
    const pL = parseFloat(document.getElementById('pLuce').value);
    const pD = parseFloat(document.getElementById('pDiesel').value);
    const tStart = document.getElementById('t_start').value;
    const tEnd = document.getElementById('t_end').value;
    const luogo = document.querySelector('input[name="luogoRicarica"]:checked').value;

    if (isNaN(km) || isNaN(att) || isNaN(tar)) return alert("Dati mancanti");
    
    const kwh = appConfig.cap * (tar - att) / 100;
    let kwhRete = (luogo === 'DOMESTICA') ? kwh * (1 + (parseFloat(document.getElementById('dispersionVal').value)/100)) : kwh / appConfig.efficienza;
    const spesa = kwhRete * pL;
    const risp = ((kwh / appConfig.consEv) * 100 / 100 * appConfig.consTermico * pD) - spesa;

    const record = { 
        tipo: 'RICARICA', luogo, isoDate: dataIn.toISOString(), 
        data: dataIn.toLocaleDateString('it-IT'), km, batt: `${att}%→${tar}%`, 
        c_att: att, c_tar: tar, t_start: tStart || '', t_end: tEnd || '', 
        spesa, risp, kwh 
    };

    saveToDb(record, 'editIndex');
    localStorage.setItem('ev_pref_v5_5', JSON.stringify({pL, pD, pKw: document.getElementById('pKw_carica').value}));
    annullaModifica();
}

function salvaCheck() {
    const dataIn = document.getElementById('chk_data').valueAsDate || new Date();
    const km = parseFloat(document.getElementById('chk_km').value);
    const perc = document.getElementById('chk_perc').value;
    const record = { tipo: 'CHECK', isoDate: dataIn.toISOString(), data: dataIn.toLocaleDateString('it-IT'), km, batt: perc+"%", spesa:0, risp:0, kwh:0 };
    saveToDb(record, 'editCheckIndex');
    annullaModificaCheck();
}

function salvaManutenzione() {
    const dataIn = document.getElementById('man_data').valueAsDate || new Date();
    const costo = parseFloat(document.getElementById('man_costo').value);
    const km = parseFloat(document.getElementById('man_km').value);
    const record = { tipo: 'MANUTENZIONE', isoDate: dataIn.toISOString(), data: dataIn.toLocaleDateString('it-IT'), km: km||0, batt: document.getElementById('man_note').value, spesa: costo, risp: 0, kwh: 0 };
    saveToDb(record, 'editMaintIndex');
    annullaModificaMaint();
}

function saveToDb(record, indexFieldId) {
    let h = JSON.parse(localStorage.getItem(DB_NAME)) || [];
    const idx = parseInt(document.getElementById(indexFieldId).value);
    if (idx > -1) h[idx] = record; else h.push(record);
    h.sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate) || b.km - a.km);
    localStorage.setItem(DB_NAME, JSON.stringify(h));
    render();
}

function render() {
    const h = JSON.parse(localStorage.getItem(DB_NAME)) || [];
    const tb = document.querySelector('#tabella tbody');
    tb.innerHTML = '';
    let tKm=0, tS=0, tR=0, tKwh=0;
    
    h.forEach((r, i) => {
        if(i===0) tKm = r.km;
        tS += (r.spesa||0); tR += (r.risp||0);
        if(r.tipo==='RICARICA') tKwh += (r.kwh||0);
    });

    const displayH = showAllHistory ? h : h.slice(0, 10);
    displayH.forEach((r, i) => {
        let diff = '-';
        if (i < h.length - 1) {
            const prev = h[i+1];
            if (r.km && prev.km) diff = (r.km - prev.km);
        }
        const row = tb.insertRow();
        row.innerHTML = `
            <td>${r.data}</td>
            <td>${r.tipo==='RICARICA'?(r.luogo==='DOMESTICA'?'🏠':'⛽'):r.tipo==='CHECK'?'📝':'🛠️'}</td>
            <td>${r.km}</td>
            <td>${diff}</td>
            <td>${r.batt}</td>
            <td>${r.t_start && r.t_end ? r.t_start+'-'+r.t_end : '-'}</td>
            <td style="color:var(--expense)">€${r.spesa.toFixed(2)}</td>
            <td style="color:var(--save)">€${r.risp.toFixed(2)}</td>
            <td>
                <button onclick="modifica(${i})" style="border:none;background:var(--edit);color:white;padding:4px 8px;border-radius:5px;">✏️</button>
                <button onclick="elimina(${i})" style="border:none;background:#ff5252;color:white;padding:4px 8px;border-radius:5px;">🗑️</button>
            </td>
        `;
    });

    document.getElementById('totKmReali').innerText = tKm.toLocaleString();
    document.getElementById('totSpesa').innerText = '€ ' + tS.toFixed(2);
    document.getElementById('totRisp').innerText = '€ ' + tR.toFixed(2);
    
    if(h.length > 1){
        const totalKm = h[0].km - h[h.length-1].km;
        document.getElementById('avgConsumo').innerText = totalKm > 0 ? (tKwh / totalKm * 100).toFixed(1) : '---';
    }
    updateChart(h);
}

function updateChart(h) {
    const ctx = document.getElementById('savingsChart').getContext('2d');
    const last10 = h.filter(x => x.tipo==='RICARICA').slice(0, 10).reverse();
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: last10.map(x => x.data),
            datasets: [
                { label: 'Spesa €', data: last10.map(x => x.spesa), backgroundColor: '#c62828' },
                { label: 'Risp €', data: last10.map(x => x.risp), backgroundColor: '#2e7d32' }
            ]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

function modifica(i) {
    const h = JSON.parse(localStorage.getItem(DB_NAME));
    const r = h[i];
    if(r.tipo==='RICARICA') {
        openTab('carica'); document.getElementById('editIndex').value = i;
        document.getElementById('kmOdo').value = r.km; document.getElementById('c_att').value = r.c_att; document.getElementById('c_tar').value = r.c_tar;
        document.getElementById('t_start').value = r.t_start; document.getElementById('t_end').value = r.t_end;
        toggleEdit('btnSalva', 'btnAnnulla', true);
    }
}

function toggleEdit(s,c,on){ document.getElementById(s).innerText=on?"🔄 Aggiorna":"💾 Salva"; document.getElementById(c).style.display=on?'block':'none'; }
function annullaModifica(){ document.getElementById('editIndex').value=-1; toggleEdit('btnSalva','btnAnnulla',false); }
function annullaModificaCheck(){ document.getElementById('editCheckIndex').value=-1; }
function annullaModificaMaint(){ document.getElementById('editMaintIndex').value=-1; }

function calcolaBolletta() {
    const h = JSON.parse(localStorage.getItem(DB_NAME)) || [];
    const dVal = parseFloat(document.getElementById('dispersionVal').value)/100;
    const stats = {};
    h.filter(x => x.tipo==='RICARICA' && x.luogo==='DOMESTICA').forEach(r => {
        const d = new Date(r.isoDate);
        const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
        if(!stats[key]) stats[key] = { kwh: 0, spesa: 0 };
        stats[key].kwh += r.kwh;
        stats[key].spesa += r.spesa;
    });
    const body = document.getElementById('billBody');
    body.innerHTML = '';
    Object.keys(stats).sort().reverse().forEach(k => {
        const row = body.insertRow();
        row.innerHTML = `<td>${k}</td><td>${stats[k].kwh.toFixed(1)}</td><td>${(stats[k].kwh*(1+dVal)).toFixed(1)}</td><td style="color:var(--expense)">€${stats[k].spesa.toFixed(2)}</td>`;
    });
}

function esportaExcel() {
    const h = JSON.parse(localStorage.getItem(DB_NAME)) || [];
    let csv = "Data;Tipo;Km;Info;Spesa;Risparmio;Kwh\n";
    h.forEach(r => csv += `${r.data};${r.tipo};${r.km};${r.batt};${r.spesa.toFixed(2)};${r.risp.toFixed(2)};${r.kwh.toFixed(2)}\n`);
    const blob = new Blob([csv], { type: 'text/csv' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "EV_Monitor_Backup.csv";
    link.click();
}

function importaCSV(event) {
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = function(e) {
        const lines = e.target.result.split('\n');
        const newDb = [];
        for(let i=1; i<lines.length; i++) {
            const c = lines[i].split(';');
            if(c.length < 5) continue;
            newDb.push({ data: c[0], tipo: c[1], km: parseFloat(c[2]), batt: c[3], spesa: parseLocalNum(c[4]), risp: parseLocalNum(c[5]), kwh: parseLocalNum(c[6]), isoDate: new Date().toISOString() });
        }
        localStorage.setItem(DB_NAME, JSON.stringify(newDb));
        render();
    };
    reader.readAsText(file);
}

function elimina(i){ if(confirm("Eliminare?")){ let h=JSON.parse(localStorage.getItem(DB_NAME)); h.splice(i,1); localStorage.setItem(DB_NAME,JSON.stringify(h)); render(); } }
function pulisci() { if(confirm("Resettare tutto?")) { localStorage.removeItem(DB_NAME); render(); } }
function toggleShowAll() { showAllHistory = !showAllHistory; render(); }
</script>
</body>
</html>
